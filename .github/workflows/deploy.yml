name: Deploy Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Build check (dry-run)
        run: |
          set +e
          wrangler deploy --dry-run --outdir=./.dry-run-check > build.log 2>&1
          code=$?
          echo "### 🔍 بررسی ساخت (dry-run)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $code -ne 0 ]; then
            echo "### ❌ خطای ساخت — Wrangler" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### ✅ ساخت سالم" >> $GITHUB_STEP_SUMMARY

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy > deploy.log 2>&1
          code=$?
          echo "### 📤 خروجی Wrangler" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: Sync Secrets
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          WALLET_TOKEN: ${{ secrets.WALLET_TOKEN }}
        run: |
          printf '%s' "$BALE_BOT_TOKEN" | wrangler secret put BALE_BOT_TOKEN
          printf '%s' "$WALLET_TOKEN" | wrangler secret put WALLET_TOKEN