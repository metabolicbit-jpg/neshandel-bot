name = "neshandel-bot"
main = "index.js"
compatibility_date = "2024-04-03"

# ========== KV ==========
[[kv_namespaces]]
binding = "USERS_KV"
id = "81218df778704c32ba02d7405bbd3384"

# ========== Durable Objects ==========
[[durable_objects.bindings]]
name = "CREDIT_MANAGER"
class_name = "CreditManager"

# ========== Migrations ==========
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditManager"]

# ========== متغیرها ==========
[vars]
CURRENT_PHASE = "1"
ALLOWED_USERS = ""

# ========== Cron Trigger (هر شب ۳ صبح UTC) ==========
[triggers]
crons = ["0 3 * * *"]

# ========== لاگ‌گیری ==========
[observability]
enabled = true